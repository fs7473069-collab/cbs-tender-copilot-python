services:

  # Ollama — local LLM server (qwen3:8b)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # CPU-only (no GPU on this VM)
    environment:
      - OLLAMA_NUM_PARALLEL=1

  # Python RabbitMQ consumer / document intelligence worker
  python-agent:
    build: .
    container_name: rfp-python-agent
    restart: unless-stopped
    env_file: .env
    environment:
      # Override Ollama URL to reach the ollama service
      OLLAMA_URL: http://ollama:11434/api/generate
    depends_on:
      - ollama
    volumes:
      - agent_data:/app/data
      - agent_chunks:/app/chunks

volumes:
  ollama_data:
  agent_data:
  agent_chunks:
